<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#090a0f"/>
  <circle cx="400" cy="180" r="190" fill="#dc2626" opacity="0.09"/>
  <!-- Quadro de cortiça / parede de investigação -->
  <rect x="190" y="30" width="420" height="295" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <!-- Fio vermelho conectando pistas -->
  <line x1="310" y1="80" x2="510" y2="125" stroke="#ef4444" stroke-width="3"/>
  <line x1="510" y1="125" x2="340" y2="235" stroke="#ef4444" stroke-width="3"/>
  <!-- Cartaz de Desaparecida -->
  <g transform="translate(235, 55) rotate(-4)">
    <rect x="0" y="0" width="145" height="190" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
    <rect x="14" y="14" width="117" height="26" fill="#dc2626"/>
    <text x="72" y="32" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">MISSING</text>
    <!-- Silhueta da Hóspede -->
    <rect x="26" y="48" width="93" height="82" fill="#1f2937"/>
    <circle cx="72" cy="78" r="16" fill="#9ca3af"/>
    <path d="M46 125 C46 102 98 102 98 125 Z" fill="#9ca3af"/>
    <line x1="24" y1="145" x2="120" y2="145" stroke="#374151" stroke-width="4"/>
    <line x1="34" y1="160" x2="110" y2="160" stroke="#6b7280" stroke-width="3"/>
    <!-- Tachinha vermelha -->
    <circle cx="72" cy="8" r="6" fill="#ef4444"/>
  </g>
  <!-- Foto Polaroid do Rancho -->
  <g transform="translate(435, 85) rotate(6)">
    <rect x="0" y="0" width="125" height="145" rx="3" fill="#e5e7eb"/>
    <rect x="10" y="10" width="105" height="95" fill="#0f172a"/>
    <polygon points="62,38 25,75 100,75" fill="#1e293b"/>
    <rect x="35" y="75" width="55" height="30" fill="#1e293b"/>
    <rect x="55" y="83" width="12" height="12" fill="#f59e0b"/>
    <circle cx="62" cy="8" r="6" fill="#ef4444"/>
    <text x="62" y="128" fill="#1f2937" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ÚLTIMO REGISTRO</text>
  </g>
</svg>
